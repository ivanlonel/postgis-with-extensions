name: CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # postgis/postgis rebuilds its images on Mondays at 05:15 UTC.
    - cron: "15 7 * * 1"
  workflow_dispatch:
    inputs:
      postgis:
        description: PostGIS major.minor to build (3.6 only for the one-off final 3.6 release)
        type: choice
        options:
          - "3.7"
          - "3.6"
        default: "3.7"
      publish:
        description: Push the images (only honoured on master)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.postgis || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POSTGIS_VERSION: ${{ inputs.postgis || '3.7' }}
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.10"
          extra-args: --all-files --verbose

      - name: Run the static tests
        run: uv run --exact pytest tests/test_manifest.py

      - name: Validate the compose example
        working-directory: compose_example
        run: |
          mkdir -p secrets
          for secret in postgres-passwd pgadmin-email pgadmin-passwd; do
            echo placeholder > "secrets/$secret.txt"
          done
          docker compose config --quiet

  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      regular: ${{ steps.split.outputs.regular }}
      extended: ${{ steps.split.outputs.extended }}
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the Bake targets
        id: matrix
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          target: default

      - name: Split the regular and extended targets
        # Extended targets are pg<major>-<suffix>; base names the regular target they build on.
        id: split
        env:
          TARGETS: ${{ steps.matrix.outputs.matrix }}
        run: |
          echo "regular=$(jq -c 'map(select(.target | contains("-") | not))' <<< "$TARGETS")" >> "$GITHUB_OUTPUT"
          echo "extended=$(jq -c 'map(select(.target | contains("-")) | .base = (.target | split("-")[0]))' <<< "$TARGETS")" >> "$GITHUB_OUTPUT"

  build-test:
    name: build-test (${{ matrix.target }})
    needs:
      - lint
      - matrix
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: &build-test-permissions
      contents: read
      packages: write # GHCR build cache, and the GHCR push of publishing runs
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.regular) }}
    env: &build-test-env
      CACHE_REF: ghcr.io/${{ github.repository }}:buildcache-${{ matrix.target }}-${{ inputs.postgis || '3.7' }}
      # The cache of the regular target an extended one builds on (a regular target's own).
      BASE_CACHE_REF: ghcr.io/${{ github.repository }}:buildcache-${{ matrix.base || matrix.target }}-${{ inputs.postgis || '3.7' }}
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master') }}
      TEST_IMAGE: postgis-with-extensions:test
    steps: &build-test-steps
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the build arguments
        id: args
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Free disk space for an extended image
        # Its Rust builds, and the image itself, outgrow the runner's free space otherwise.
        if: contains(matrix.target, '-')
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          APT_CACHE_BUST: ${{ steps.args.outputs.week }}
          REVISION: ${{ github.sha }}
        with:
          source: .
          targets: ${{ matrix.target }}
          load: true
          # The base cache comes first, so an extended image reuses its regular image's layers.
          set: |
            ${{ matrix.target }}.tags=${{ env.TEST_IMAGE }}
            ${{ matrix.target }}.cache-from=type=registry,ref=${{ env.BASE_CACHE_REF }}
            ${{ matrix.target }}.cache-from+=type=registry,ref=${{ env.CACHE_REF }}
            ${{ matrix.target }}.cache-to=type=registry,ref=${{ env.CACHE_REF }},mode=max,ignore-error=true

      - name: Report the image size
        run: |
          size="$(docker image inspect --format '{{.Size}}' "$TEST_IMAGE")"
          echo "${TARGET}: $((size / 1024 / 1024)) MiB uncompressed" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          TARGET: ${{ matrix.target }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Test
        # The tests take about 15 minutes: fail a hung run in time to collect its server logs.
        timeout-minutes: 45
        env:
          TARGET: ${{ matrix.target }}
          STRICT_DRIFT: ${{ github.event_name == 'pull_request' }}
          PWE_TEST_LOGS: ${{ runner.temp }}/container-logs
        run: |
          args=(--image "$TEST_IMAGE" --junitxml=junit.xml)
          # Upgrade from the image currently published under this tag, if there is one yet;
          # otherwise the test falls back to the pre-rewrite image pinned in tests/upgrade.
          # Targets are pg<major> and pg<major>-<suffix>, tagged <major>-<PostGIS>[-<suffix>].
          major="${TARGET#pg}"
          suffix=""
          if [[ "$major" == *-* ]]; then
            suffix="-${major#*-}"
            major="${major%%-*}"
          fi
          previous="ghcr.io/${GITHUB_REPOSITORY}:${major}-${POSTGIS_VERSION}${suffix}"
          if docker buildx imagetools inspect "$previous" > /dev/null 2>&1; then
            args+=(--old-image "$previous")
          fi
          if [[ "$STRICT_DRIFT" == true ]]; then
            args+=(--strict-drift)
          fi
          uv run --exact pytest "${args[@]}"

      - name: Save the logs of the servers left running
        # The tests save each server's log as its container goes away, which a timeout prevents.
        if: ${{ !cancelled() }}
        env:
          PWE_TEST_LOGS: ${{ runner.temp }}/container-logs
        run: |
          mkdir -p "$PWE_TEST_LOGS"
          docker ps --all --filter label=io.github.ivanlonel.postgis-with-extensions.test --format '{{.Names}}' |
            while read -r name; do
              docker logs "$name" > "$PWE_TEST_LOGS/$name.log" 2>&1
            done

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.target }}-${{ env.POSTGIS_VERSION }}
          path: junit.xml

      - name: Upload the server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-logs-${{ matrix.target }}-${{ env.POSTGIS_VERSION }}
          path: ${{ runner.temp }}/container-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          APT_CACHE_BUST: ${{ steps.args.outputs.week }}
          REVISION: ${{ github.sha }}
        with:
          source: .
          targets: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true
          set: |
            ${{ matrix.target }}.cache-from=type=registry,ref=${{ env.CACHE_REF }}

  build-test-full:
    # Each extended image builds on its regular image's cache once every regular job is done, so it
    # doesn't rebuild the regular layers and the published images share them. It still runs when a
    # regular job fails (rebuilding what that one didn't cache), as one matrix used to.
    name: build-test (${{ matrix.target }})
    needs:
      - lint
      - matrix
      - build-test
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.matrix.result == 'success' && needs.matrix.outputs.extended != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: *build-test-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.extended) }}
    env: *build-test-env
    steps: *build-test-steps

  passed:
    # The one check master's ruleset requires (auto-merge waits for it), whatever the build matrix holds.
    # The ruleset names it by this job name: rename both together.
    name: CI passed
    if: always()
    needs:
      - lint
      - matrix
      - build-test
      - build-test-full
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that every job succeeded
        # build-test-full is skipped when there are no extended images (PostGIS 3.6); any other
        # skip follows the failure of a job listed here too.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::A job this check depends on ended with: $result"
              exit 1
            fi
          done

  dockerhub-description:
    needs:
      - build-test
      - build-test-full
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Write the Docker Hub copy of the README
        # Docker Hub caps descriptions at 25,000 characters: its copy leaves out the Development section.
        run: uv run --exact python -m scripts.render_readme --dockerhub dockerhub.md

      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ github.repository }}
          readme-filepath: ./dockerhub.md

  upstream-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compare the build matrix with upstream
        run: uv run --exact python -m scripts.check_upstream
