url = "https://github.com/michaelpq/pg_plugins/tree/main/decoder_raw"
provides = []
note = "Logical decoding output plugin (SQL statements), not an extension; trusted on new clusters"

[[extension]]
name = "decoderbufs"
url = "https://github.com/debezium/postgres-decoderbufs"
note = "Logical decoding output plugin (Protocol Buffers, for Debezium), trusted on new clusters; its package lists it as an extension, but there's nothing to create"

[[extension]]
name = "DocumentDB"
url = "https://github.com/documentdb/documentdb"
provides = [
  "documentdb",
  "documentdb_core",
  "documentdb_distributed",
  "documentdb_extended_rum",
]
pg = ">=15"
preload = "pg_documentdb"
note = "Opt-in. SQL API only (no MongoDB wire-protocol gateway); `documentdb_distributed` also needs Citus preloaded"
extended = true

[[extension]]
