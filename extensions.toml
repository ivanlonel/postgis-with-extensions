# The extensions this image adds to postgis/postgis, rendered into the README and checked by the
# tests. Keys of each [[extension]]:
#   name      display name (also the default for `provides`)
#   url       project home page
#   provides  PostgreSQL extensions installed (defaults to [name]; empty for non-extensions)
#   pg        PostgreSQL majors shipped, as constraints such as ">=15" or "<=17"
#   preload   library to list in SHARED_PRELOAD_LIBRARIES to use it
#   note      remark for the README
#   extended  true when only the extended images (the -full tags) ship it

[[extension]]
name = "address_standardizer"
url = "https://github.com/postgis/address_standardizer"
provides = [
  "address_standardizer",
  "address_standardizer-3",
  "address_standardizer_data_us",
  "address_standardizer_data_us-3",
]
note = "Packaged separately from PostGIS since 3.7"

[[extension]]
name = "age"
url = "https://github.com/apache/age"

[[extension]]
name = "asn1oid"
url = "https://github.com/df7cb/pgsql-asn1oid"

[[extension]]
name = "Citus"
url = "https://github.com/citusdata/citus"
provides = ["citus", "citus_columnar"]
preload = "citus"
note = "Opt-in; loaded before every other library, as Citus requires. PostgreSQL 14 gets Citus 12.1 and 15 gets 13"
extended = true

[[extension]]
name = "credcheck"
url = "https://github.com/HexaCluster/credcheck"
preload = "credcheck"

[[extension]]
