url = "https://github.com/timescale/timescaledb-toolkit"
provides = ["timescaledb_toolkit"]
pg = ">=15"
note = "Timescale License (TSL)"

[[extension]]
name = "timestamp9"
url = "https://github.com/optiver/timestamp9"

[[extension]]
name = "toastinfo"
url = "https://github.com/credativ/toastinfo"

[[extension]]
name = "TopN"
url = "https://github.com/citusdata/postgresql-topn"
provides = ["topn"]

[[extension]]
name = "unit"
url = "https://github.com/df7cb/postgresql-unit"

[[extension]]
name = "VectorChord"
url = "https://github.com/supervc-stack/VectorChord"
provides = ["vchord"]
preload = "vchord"
note = "Dual-licensed AGPLv3 / ELv2"

[[extension]]
name = "wal2json"
url = "https://github.com/eulerto/wal2json"
provides = []
note = "Logical decoding output plugin, not an extension"
